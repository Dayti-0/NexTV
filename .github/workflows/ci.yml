name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (JVM) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Cache enregistré aussi depuis les branches de travail (pas seulement la branche principale).
          cache-read-only: false
      - name: Test core module
        run: ./gradlew -p core test --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/

  android:
    name: Android build (debug + release) & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Cache enregistré aussi depuis les branches de travail (pas seulement la branche principale).
          cache-read-only: false
      - name: Assemble and lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug --stacktrace
      - name: Show lint errors
        if: failure()
        run: |
          find app/build -name 'lint-results-debug.txt' -exec grep -h -A6 ': Error: ' {} + || true
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nextv-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  screenshots:
    timeout-minutes: 30
    name: Screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Cache enregistré aussi depuis les branches de travail (pas seulement la branche principale).
          cache-read-only: false
      - name: Render screenshots
        run: ./gradlew :app:recordRoborazziDebug --stacktrace
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore
      - name: Publish to the screenshots branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Code inchangé (captures reprises du cache de Gradle, sans fichier) : celles de la branche restent valables.
          if ! ls app/build/screenshots/*.png > /dev/null 2>&1; then
            echo "Aucune nouvelle capture : la branche screenshots reste telle quelle."
            exit 0
          fi
          WORK="$RUNNER_TEMP/screenshots"
          mkdir -p "$WORK"
          cp app/build/screenshots/*.png "$WORK"/
          cd "$WORK"
          {
            echo "# Captures d'écran NexTV"
            echo
            echo "Générées par la CI pour \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7})."
            echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "![${f%.png}]($f)"; echo; done
          } > README.md
          git init -q -b screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Captures d'écran de ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
