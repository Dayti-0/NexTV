name: Release

# Publication d'une version, au choix :
#  - pousser un tag :                git tag v0.1.0 && git push origin v0.1.0
#  - pousser une branche de version : release/v0.1.0 (ou claude/release-v0.1.0)
#  - lancer le workflow à la main (onglet Actions) avec la version voulue.
# Le tag est créé par la publication s'il n'existe pas encore.
# Signature, au choix :
#  - clé privée chiffrée dans le dépôt (app/nextv-release.keystore.enc, créée par le workflow
#    « Signing key ») et son mot de passe dans le secret NEXTV_KEY_PASSPHRASE ;
#  - ou les secrets NEXTV_KEYSTORE_BASE64, NEXTV_KEYSTORE_PASSWORD, NEXTV_KEY_ALIAS et NEXTV_KEY_PASSWORD.
# Sans l'un ni l'autre, l'APK est signé avec la clé de test du dépôt (app/nextv-test.keystore).
# Fiches films/séries : le secret facultatif NEXTV_TMDB_API_KEY intègre une clé TMDB à l'APK.
# Section Foot : le secret facultatif NEXTV_FOOTBALL_API_KEY intègre une clé football-data.org.
# Mises à jour depuis l'application : elles lisent les versions publiées de ce dépôt (il doit être public).
# Pour garder le code privé : créer un dépôt public NexTV-releases (avec un README) et le secret
# NEXTV_RELEASES_TOKEN (jeton d'accès en écriture au contenu de ce dépôt) ; les APK y sont alors aussi
# publiés et l'application y cherche ses mises à jour. Autre nom : variable NEXTV_RELEASES_REPO.

on:
  push:
    tags: ["v*"]
    branches: ["release/v*", "claude/release-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.NEXTV_KEYSTORE_BASE64 }}
      RELEASES_TOKEN: ${{ secrets.NEXTV_RELEASES_TOKEN }}
      RELEASES_REPO: ${{ vars.NEXTV_RELEASES_REPO || format('{0}/NexTV-releases', github.repository_owner) }}
    steps:
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${GITHUB_REF_NAME##*release[-/]}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version invalide : '$TAG' (attendu : vX.Y.Z ou vX.Y.Z-suffixe)"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          # Numéro interne de la version (versionCode), tiré de son nom : 0.2.94 → 20094. Il augmente avec chaque
          # version, quel que soit le workflow (le compteur d'exécutions repartirait de 1 si le workflow était recréé,
          # et Android refuserait alors les mises à jour). 10# : « 08 » se lit en décimal, pas en octal.
          BASE="${TAG#v}"
          BASE="${BASE%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          VERSION_CODE=$(( 10#$MAJOR * 1000000 + 10#$MINOR * 10000 + 10#$PATCH ))
          if [ "$VERSION_CODE" -le 1000 ]; then
            echo "::error::Numéro de version interne trop petit : $VERSION_CODE (les versions publiées vont jusqu'à quelques centaines)"
            exit 1
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ -n "$RELEASES_TOKEN" ]; then
            echo "UPDATE_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"
          else
            echo "UPDATE_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Cache Gradle (dépendances, résultats de compilation) enregistré aussi depuis les branches de
          # travail et de version : les publications suivantes repartent de ce qui est déjà construit.
          cache-read-only: false

      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "NEXTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY=1" >> "$GITHUB_ENV"

      # Une fois la clé privée créée, jamais de repli sur la clé de test : la mise à jour serait refusée.
      - name: Decrypt the release signing key
        if: env.KEYSTORE_BASE64 == '' && hashFiles('app/nextv-release.keystore.enc') != ''
        env:
          PASSPHRASE: ${{ secrets.NEXTV_KEY_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::Clé de signature chiffrée présente mais secret NEXTV_KEY_PASSPHRASE absent."
            exit 1
          fi
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in app/nextv-release.keystore.enc -out "$RUNNER_TEMP/release.jks" -pass env:PASSPHRASE
          echo "NEXTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY=1" >> "$GITHUB_ENV"

      # Tests du cœur (playlists, guide, réseau, sauvegarde : une minute environ) : une version dont ils échouent
      # n'est pas publiée. Ceux de l'application (plus longs) tournent dans la CI à chaque envoi.
      - name: Test core module
        run: ./gradlew -p core test --stacktrace

      - name: Build release APK
        env:
          NEXTV_KEYSTORE_PASSWORD: ${{ secrets.NEXTV_KEYSTORE_PASSWORD || secrets.NEXTV_KEY_PASSPHRASE }}
          NEXTV_KEY_ALIAS: ${{ secrets.NEXTV_KEY_ALIAS || 'nextv' }}
          NEXTV_KEY_PASSWORD: ${{ secrets.NEXTV_KEY_PASSWORD || secrets.NEXTV_KEY_PASSPHRASE }}
          # Clé TMDB facultative intégrée à l'APK (sinon, elle se saisit dans les réglages).
          NEXTV_TMDB_API_KEY: ${{ secrets.NEXTV_TMDB_API_KEY }}
          # Clé football-data.org facultative (section Foot), intégrée de la même façon.
          NEXTV_FOOTBALL_API_KEY: ${{ secrets.NEXTV_FOOTBALL_API_KEY }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -Pnextv.versionName="$VERSION" \
            -Pnextv.versionCode="${VERSION_CODE}" \
            -Pnextv.updateRepo="${UPDATE_REPO}"

      - name: Prepare release assets
        run: |
          APK="NexTV-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          # Table de correspondance de R8 : décode les traces des plantages (« Dernier incident » des réglages).
          MAPPING="NexTV-${TAG}-mapping.txt"
          cp app/build/outputs/mapping/release/mapping.txt "$MAPPING"
          # Nom fixe : lien stable vers la dernière version (…/releases/latest/download/NexTV.apk).
          cp "$APK" NexTV.apk
          if [ -n "$PRIVATE_KEY" ]; then
            SIGNING="Signé avec la clé privée du projet : les versions suivantes s'installent par-dessus celle-ci (Réglages › Mise à jour), playlists et réglages conservés. En venant d'une version signée autrement (0.2.1 ou plus ancienne), désinstallez-la d'abord."
          else
            SIGNING="Version de test signée avec la clé de test du dépôt : elle s'installe par-dessus la précédente (à partir de la 0.2.2 ; une seule désinstallation nécessaire en venant d'une version plus ancienne)."
          fi
          # Nouveautés : la section de la version dans CHANGELOG.md (« ## 0.2.36 »), seule affichée par l'application.
          CHANGES=$(awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -z "$CHANGES" ]; then
            CHANGES="- Corrections et améliorations"
          fi
          cat > notes.md <<NOTES
          Version ${VERSION} de NexTV (Android 7.0+, téléphone, tablette et Android TV).

          **Nouveautés**
          ${CHANGES}

          **Installation** : téléchargez \`${APK}\`, autorisez l'installation depuis des sources inconnues puis ouvrez le fichier.
          Lien permanent vers la dernière version (Fire TV, app Downloader) : https://github.com/${UPDATE_REPO}/releases/latest/download/NexTV.apk

          ${SIGNING}
          NOTES
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "MAPPING=$MAPPING" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "$APK" "$APK.sha256" NexTV.apk "$MAPPING" \
            --target "$GITHUB_SHA" \
            --title "NexTV ${TAG}" \
            --notes-file notes.md \
            $PRERELEASE

      - name: Publish to the public releases repository
        if: env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.NEXTV_RELEASES_TOKEN }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "$APK" "$APK.sha256" NexTV.apk \
            --repo "$RELEASES_REPO" \
            --title "NexTV ${TAG}" \
            --notes-file notes.md \
            $PRERELEASE
