name: Release

# Publication d'une version, au choix :
#  - pousser un tag :                git tag v0.1.0 && git push origin v0.1.0
#  - pousser une branche de version : release/v0.1.0 (ou claude/release-v0.1.0)
#  - lancer le workflow à la main (onglet Actions) avec la version voulue.
# Le tag est créé par la publication s'il n'existe pas encore.
# Signature, au choix :
#  - clé privée chiffrée dans le dépôt (app/nextv-release.keystore.enc, créée par le workflow
#    « Signing key ») et son mot de passe dans le secret NEXTV_KEY_PASSPHRASE ;
#  - ou les secrets NEXTV_KEYSTORE_BASE64, NEXTV_KEYSTORE_PASSWORD, NEXTV_KEY_ALIAS et NEXTV_KEY_PASSWORD.
# Sans l'un ni l'autre, l'APK est signé avec la clé de test du dépôt (app/nextv-test.keystore).
# Fiches films/séries : le secret facultatif NEXTV_TMDB_API_KEY intègre une clé TMDB à l'APK.
# Mises à jour depuis l'application : elles lisent les versions publiées de ce dépôt (il doit être public).
# Pour garder le code privé : créer un dépôt public NexTV-releases (avec un README) et le secret
# NEXTV_RELEASES_TOKEN (jeton d'accès en écriture au contenu de ce dépôt) ; les APK y sont alors aussi
# publiés et l'application y cherche ses mises à jour. Autre nom : variable NEXTV_RELEASES_REPO.

on:
  push:
    tags: ["v*"]
    branches: ["release/v*", "claude/release-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.NEXTV_KEYSTORE_BASE64 }}
      RELEASES_TOKEN: ${{ secrets.NEXTV_RELEASES_TOKEN }}
      RELEASES_REPO: ${{ vars.NEXTV_RELEASES_REPO || format('{0}/NexTV-releases', github.repository_owner) }}
    steps:
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${GITHUB_REF_NAME##*release[-/]}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version invalide : '$TAG' (attendu : vX.Y.Z ou vX.Y.Z-suffixe)"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          if [ -n "$RELEASES_TOKEN" ]; then
            echo "UPDATE_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"
          else
            echo "UPDATE_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "NEXTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY=1" >> "$GITHUB_ENV"

      # Une fois la clé privée créée, jamais de repli sur la clé de test : la mise à jour serait refusée.
      - name: Decrypt the release signing key
        if: env.KEYSTORE_BASE64 == '' && hashFiles('app/nextv-release.keystore.enc') != ''
        env:
          PASSPHRASE: ${{ secrets.NEXTV_KEY_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::Clé de signature chiffrée présente mais secret NEXTV_KEY_PASSPHRASE absent."
            exit 1
          fi
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in app/nextv-release.keystore.enc -out "$RUNNER_TEMP/release.jks" -pass env:PASSPHRASE
          echo "NEXTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY=1" >> "$GITHUB_ENV"

      - name: Test core module
        run: ./gradlew -p core test --stacktrace

      - name: Build release APK
        env:
          NEXTV_KEYSTORE_PASSWORD: ${{ secrets.NEXTV_KEYSTORE_PASSWORD || secrets.NEXTV_KEY_PASSPHRASE }}
          NEXTV_KEY_ALIAS: ${{ secrets.NEXTV_KEY_ALIAS || 'nextv' }}
          NEXTV_KEY_PASSWORD: ${{ secrets.NEXTV_KEY_PASSWORD || secrets.NEXTV_KEY_PASSPHRASE }}
          # Clé TMDB facultative intégrée à l'APK (sinon, elle se saisit dans les réglages).
          NEXTV_TMDB_API_KEY: ${{ secrets.NEXTV_TMDB_API_KEY }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -Pnextv.versionName="$VERSION" \
            -Pnextv.versionCode="${GITHUB_RUN_NUMBER}" \
            -Pnextv.updateRepo="${UPDATE_REPO}"

      - name: Prepare release assets
        run: |
          APK="NexTV-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if [ -n "$PRIVATE_KEY" ]; then
            SIGNING="Signé avec la clé privée du projet : les versions suivantes s'installent par-dessus celle-ci (Réglages › Mise à jour), playlists et réglages conservés. En venant d'une version signée autrement (0.2.1 ou plus ancienne), désinstallez-la d'abord."
          else
            SIGNING="Version de test signée avec la clé de test du dépôt : elle s'installe par-dessus la précédente (à partir de la 0.2.2 ; une seule désinstallation nécessaire en venant d'une version plus ancienne)."
          fi
          cat > notes.md <<NOTES
          Version ${VERSION} de NexTV (Android 7.0+, téléphone, tablette et Android TV).

          **Fonctionnalités**
          - Démarrage direct sur la dernière playlist, avec progression réelle du chargement
          - Accueil TV, Films, Séries et Guide TV, favoris (appui long sur OK) réorganisables
          - Fiches films et séries enrichies par TMDB (clé d'API à saisir dans les réglages)
          - Lecteur : bandeau avec heure, programme et débit, zapping haut/bas, liste des chaînes sur « Retour » (catégories avec gauche/droite)
          - Pause du direct (OK) avec affichage du retard sur le direct, retour au direct avec droite
          - Reprise de lecture des films et séries (catégorie « Reprendre la lecture », bouton sur les fiches)
          - Qualité automatique FHD → HD → SD → LOW entre les versions de la playlist (désactivable), baisse si l'appareil perd des images
          - Infos de lecture (touche Info/Menu) et choix du décodeur vidéo matériel ou logiciel
          - Nombre de chaînes et d'affiches par ligne réglable ; double appui sur « Retour » pour revenir à l'accueil
          - Ajout d'une playlist depuis un ordinateur : adb shell "am start -n tv.nextv.app/.MainActivity --es url 'ADRESSE'"
          - Mise à jour depuis les réglages (versions publiées publiquement sur GitHub)
          - Guide TV xmltvfr.fr téléchargé, mis en cache et actualisé automatiquement
          - Playlists M3U/M3U8 distantes ou locales, protégées par identifiants (chiffrés, masqués dans les journaux)
          - Proxy HTTP/SOCKS pour les playlists, le guide et les flux

          **Installation** : téléchargez \`${APK}\`, autorisez l'installation depuis des sources inconnues puis ouvrez le fichier.

          ${SIGNING}
          NOTES
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in v0.*|*-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "NexTV ${TAG}" \
            --notes-file notes.md \
            $PRERELEASE

      - name: Publish to the public releases repository
        if: env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.NEXTV_RELEASES_TOKEN }}
        run: |
          PRERELEASE=""
          case "$TAG" in v0.*|*-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$RELEASES_REPO" \
            --title "NexTV ${TAG}" \
            --notes-file notes.md \
            $PRERELEASE
